name: build
on:
  push:
    branches:
    - main
    paths:
    - app.py
    - .github/**
    - docs/**
    - workflow.cwl.template
    - requirements.txt
    - Dockerfile

jobs:
  python-unit-test:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: 3.x
    - name: Bootstrap patched pip and CA bundle
      shell: bash
      run: |
        python -m pip install --upgrade "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
        python -m pip install --upgrade "certifi>=2026.10.19"
        python -c "import pip, certifi; from pip._vendor import certifi as bundled; assert tuple(map(int, pip.__version__.split('.'))) >= (26, 2, 2); assert tuple(map(int, certifi.__version__.split('.'))) >= (2026, 10, 19); assert tuple(map(int, bundled.__version__.split('.'))) >= (2026, 10, 19)"
        python -m pip download --no-deps --dest "$RUNNER_TEMP/python-bootstrap" "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
        echo "VIRTUALENV_EXTRA_SEARCH_DIR=$RUNNER_TEMP/python-bootstrap" >> "$GITHUB_ENV"
        echo "VIRTUALENV_PIP=26.2.2" >> "$GITHUB_ENV"
        echo "VIRTUALENV_DOWNLOAD=false" >> "$GITHUB_ENV"
    - run: pip install -r requirements.txt
    - run: pip install nose2
    - run: nose2

  cwl-pack-validate:
    needs: python-unit-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: 3.x
    - name: Bootstrap patched pip and CA bundle
      shell: bash
      run: |
        python -m pip install --upgrade "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
        python -m pip install --upgrade "certifi>=2026.10.19"
        python -c "import pip, certifi; from pip._vendor import certifi as bundled; assert tuple(map(int, pip.__version__.split('.'))) >= (26, 2, 2); assert tuple(map(int, certifi.__version__.split('.'))) >= (2026, 10, 19); assert tuple(map(int, bundled.__version__.split('.'))) >= (2026, 10, 19)"
        python -m pip download --no-deps --dest "$RUNNER_TEMP/python-bootstrap" "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
        echo "VIRTUALENV_EXTRA_SEARCH_DIR=$RUNNER_TEMP/python-bootstrap" >> "$GITHUB_ENV"
        echo "VIRTUALENV_PIP=26.2.2" >> "$GITHUB_ENV"
        echo "VIRTUALENV_DOWNLOAD=false" >> "$GITHUB_ENV"
    - run: pip install cwltool
    - run: content=`cat app.py` yq eval '.$graph[1].requirements.InitialWorkDirRequirement.listing[0].entry=strenv(content)' workflow.cwl.template > workflow.cwl
    - run: cwltool --validate workflow.cwl

  version:
    needs: cwl-pack-validate

    runs-on: ubuntu-latest

    outputs:

      app-version: ${{ steps.set-version.outputs.version }}

    steps:
    - uses: actions/checkout@v7
    - run: echo "APP_VERSION=$(cat codemeta.json | jq -r .version )" >> $GITHUB_ENV
    - run: echo app version is $APP_VERSION
    - id: set-version
      run: echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

  container-build:

    needs: version

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - run: echo version ${{needs.version.outputs.app-version}}
    - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    - name: build & push image
      run: |
        IMAGE_ID=ghcr.io/eoap/quickwin-inline-code/python-inline-code
        docker build --pull --no-cache . --file Dockerfile --tag $IMAGE_ID:${{needs.version.outputs.app-version}}
        docker push $IMAGE_ID:${{needs.version.outputs.app-version}}

  create-release:

    needs:
    - container-build
    - version

    runs-on: ubuntu-latest

    outputs:

      upload_url: ${{ steps.set-upload-url.outputs.upload_url }}

    steps:
    - name: release
      uses: actions/create-release@v1
      id: create_release
      with:
        draft: false
        prerelease: false
        release_name: ${{needs.version.outputs.app-version}}
        tag_name: ${{needs.version.outputs.app-version}}
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - id: set-upload-url
      run: echo "upload_url=${{ steps.create_release.outputs.upload_url }}" >> "$GITHUB_OUTPUT"

  publish-artifacts:

    needs:
    - create-release
    - version

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - run: content=`cat app.py` yq eval '.$graph[1].requirements.InitialWorkDirRequirement.listing[0].entry=strenv(content)' workflow.cwl.template > workflow.cwl
    - run: |
        tag="ghcr.io/eoap/quickwin-inline-code/python-inline-code:${{needs.version.outputs.app-version}}"
        docker pull ${tag}
        shatag=$( docker inspect ${tag} | yq -r '.[0]["RepoDigests"][0]' )
        s="detect-water-body" t="${shatag}" yq -i eval '(.$graph[] | select (.id == env(s)) ).hints.DockerRequirement.dockerPull = env(t)' workflow.cwl

    - run: |
        r=$( cat codemeta.json | jq -r ".codeRepository" ) yq -i eval '."s:codeRepository" = {"URL" : env(r)}' workflow.cwl
        v="${{needs.version.outputs.app-version}}" yq -i eval '."s:softwareVersion" = env(v)' workflow.cwl
        n=$(cat codemeta.json | jq -r '(.author[0].givenName + " " + .author[0].familyName)') \
        e=$(cat codemeta.json | jq -r '.author[0].email') \
        a=$(cat codemeta.json | jq -r '.author[0].affiliation["name"]') \
        yq eval -i  '."s:author" += [{"class": "s:Person", "s.name": env(n), "s.email": env(e), "s.affiliation": env(a)}]' workflow.cwl
    - run: |
        mkdir downloads
        cp workflow.cwl downloads/app-water-body-inline-code.${{needs.version.outputs.app-version}}.cwl
    - uses: actions/upload-artifact@v4
      with:
        name: application-package
        path: downloads
    - name: upload linux artifact 1
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        upload_url: ${{needs.create-release.outputs.upload_url}}
        asset_path: downloads/app-water-body-inline-code.${{needs.version.outputs.app-version}}.cwl
        asset_name: app-water-body-inline-code.${{needs.version.outputs.app-version}}.cwl
        asset_content_type: text/yaml
