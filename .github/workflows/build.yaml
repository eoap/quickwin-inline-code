name: Candidate publication
on:
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: Publish candidate image after processing checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/acceptance.yml
  candidate:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv pip install --system --require-hashes -r requirements/development.txt
      - name: Build the intended runtime
        run: |
          docker build -t ghcr.io/eoap/quickwin-inline-code/python-inline-code:2.0.0-rc.${{ github.run_number }} .
          docker run --rm ghcr.io/eoap/quickwin-inline-code/python-inline-code:2.0.0-rc.${{ github.run_number }} python -m app --help
      - uses: docker/login-action@v3
        if: inputs.publish_candidate
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish candidate and prepare immutable CWL
        if: inputs.publish_candidate
        run: |
          image=ghcr.io/eoap/quickwin-inline-code/python-inline-code:2.0.0-rc.${{ github.run_number }}
          docker push "$image"
          published=$(docker inspect "$image" --format '{{index .RepoDigests 0}}')
          mkdir candidate
          python scripts/prepare-inline.py --image "$published" --version 2.0.0-rc.${{ github.run_number }} --output candidate/app-water-body-inline-code.cwl
          cwltool --validate candidate/app-water-body-inline-code.cwl
          cd candidate
          sha256sum app-water-body-inline-code.cwl > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: inputs.publish_candidate
        with:
          name: inline-code-candidate
          path: candidate
# Stable promotion requires recorded real-data and immutable-artifact acceptance,
# resolved license metadata, and explicit release authorization.
